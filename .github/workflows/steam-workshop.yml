# =============================================================================
# OPT-IN Steam Workshop auto-upload for PerkOracle.
#
# RECOMMENDED PATH IS LOCAL: use workshop/update.ps1 on the owning account.
# CI uploads on the MAIN Steam account risk Steam Guard / 2FA lockouts and
# unexpected re-auth prompts. This workflow is provided as opt-in only.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   STEAM_USERNAME      Steam account name that OWNS the Workshop item.
#   STEAM_CONFIG_VDF    base64 of a SteamCMD config/ssfn that is already
#                       Steam-Guard-authorized for STEAM_USERNAME (so login is
#                       non-interactive). Generate by logging in once locally
#                       with `steamcmd +login <user>` and capturing its config.
#       -- OR --
#   STEAM_TFASEED       TOTP shared secret, fed to a 2FA code generator step.
#
# Also requires the item's publishedfileid to be committed in
# workshop/perkoracle.vdf (replace the placeholder first).
#
# Trigger: a published GitHub Release.
# =============================================================================

name: Steam Workshop Upload

on:
  release:
    types: [published]

  # Manual trigger for testing once secrets are configured.
  workflow_dispatch:

jobs:
  upload:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # NOTE: pack-dist.ps1 builds against Phoenix Point's managed assemblies,
      # which are NOT present on CI runners. To use this workflow you must
      # restore those reference assemblies first (e.g. download a pinned copy
      # from a private artifact store) before the build step. Left as a TODO
      # because it depends on how you choose to provision game DLLs in CI.
      - name: Assemble Dist
        shell: pwsh
        run: |
          Write-Host "TODO: ensure Phoenix Point reference assemblies are available."
          ./workshop/pack-dist.ps1

      - name: Verify publishedfileid is set
        shell: pwsh
        run: |
          $vdf = Get-Content -Raw ./workshop/perkoracle.vdf
          if ($vdf -match 'PUBLISHEDFILEID_PLACEHOLDER') {
            throw "perkoracle.vdf still has the placeholder publishedfileid."
          }

      - name: Restore SteamCMD auth (config vdf)
        if: ${{ secrets.STEAM_CONFIG_VDF != '' }}
        shell: pwsh
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          $dir = "$env:USERPROFILE\steamcmd\config"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes(
            "$dir\config.vdf",
            [Convert]::FromBase64String($env:STEAM_CONFIG_VDF))

      - name: Upload to Workshop
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          # Install standalone SteamCMD.
          $zip = "$env:RUNNER_TEMP\steamcmd.zip"
          Invoke-WebRequest `
            "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\steamcmd" -Force
          $steam = "$env:RUNNER_TEMP\steamcmd\steamcmd.exe"
          $vdf = (Resolve-Path ./workshop/perkoracle.vdf).Path
          # Login should be non-interactive thanks to the restored config.
          & $steam +login $env:STEAM_USERNAME +workshop_build_item $vdf +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD exited $LASTEXITCODE" }
